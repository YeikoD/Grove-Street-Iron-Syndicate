<!doctype html>
<html lang="es">

<head>
  <meta charset="utf-8">
  <title>IronSyndicate</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <!-- Panel Principal Estilo GTA SA Stats Menu -->
  <section id="panel" class="panel">
    <div class="panel-header panel-header--linea">
      <!-- La misma clase que arman los cuatro menus de proximidad: el titulo se
           ve igual en los cinco paneles porque no hay dos recetas. El id queda
           como ancla para titleEl (app.js). -->
      <h1 id="title" class="panel__title">Inventario</h1>
      <!-- CJ al borde derecho de la MISMA linea, como el auto en el maletero: el
           encabezado dice de que menu es y de quien es. Ver
           .panel-header--linea. -->
      <p class="panel__subtitle">CJ</p>
    </div>

    <!-- Filtros de categoría del inventario. Antes eran pestañas de tres
         paneles (Inventario / Propiedades / Vehículos); ahora son cinco
         botones que filtran el mismo listado. El nombre de la categoría lo
         sigue diciendo la banda de grupo de la tabla, así que el botón no lo
         repite: lleva alt y title para el lector de pantalla y el hover.

         "otros" no es una categoría del mod: es todo lo que no sea arma,
         cargador ni material. El mod hoy solo tiene esos tres tipos, así que
         sale vacío, pero un tipo nuevo caería acá en vez de desaparecer. -->
    <div id="tabs" role="tablist" aria-label="Filtros de categoría">
      <button class="btn btn--tab active" data-filter="all" role="tab">
        <img class="btn--tab-icon" src="assets/iconos/categorias/todos.png" alt="Todos">
      </button>
      <button class="btn btn--tab" data-filter="weapon" role="tab">
        <img class="btn--tab-icon" src="assets/iconos/categorias/9mm.png" alt="Armas">
      </button>
      <button class="btn btn--tab" data-filter="magazine" role="tab">
        <img class="btn--tab-icon" src="assets/iconos/categorias/cargador.png" alt="Cargadores">
      </button>
      <button class="btn btn--tab" data-filter="material" role="tab">
        <img class="btn--tab-icon" src="assets/iconos/categorias/materiales.png" alt="Materiales">
      </button>
      <button class="btn btn--tab" data-filter="otros" role="tab">
        <img class="btn--tab-icon" src="assets/iconos/categorias/otros.png" alt="Otros">
      </button>
    </div>

    <!-- Filas Interactivas -->
    <div id="rows" role="listbox" aria-label="Navegación IronSyndicate"></div>

    <!-- Pie: peso a la izquierda, guía de teclas a la derecha. Las dos keycaps
         son la misma tecla X en sus dos estados: el de apretar y el de
         mantener apretado. El texto al lado dice qué hace cada uno, porque la
         diferencia se ve pero no se lee. -->
    <div id="foot">
      <div id="weight" aria-live="polite">Peso: 0kg/12kg</div>

      <div id="keyhints" class="keyhints" aria-label="Guía de teclas">
        <button class="keyhint" data-action="equip" type="button"
          title="X — apretar una vez: equipa el item">
          <img class="keyhint__cap" src="assets/keys_info/KEY_X.png" alt="">
          <span class="keyhint__act">Equipar</span>
        </button>
        <button class="keyhint" data-action="drop" type="button"
          title="X — mantener apretado: tira el item">
          <img class="keyhint__cap" src="assets/keys_info/KEY_X_PRESSED.png" alt="">
          <span class="keyhint__act">Tirar (Mantener)</span>
        </button>
      </div>
    </div>

  </section>

  <!-- Menú contextual de la fila. Va en body y no adentro de #panel a propósito:
       sale pegado al cursor en coordenadas de pantalla, así que tiene que poder
       salirse del box; y #rows es el contenedor de scroll, un menú dentro se
       movería con la lista. El contenido lo arma app.js desde ACCIONES. -->
  <div id="ctxmenu" class="ctxmenu" role="menu" hidden></div>

  <script src="app.js"></script>
</body>

</html>
