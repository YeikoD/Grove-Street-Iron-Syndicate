<!doctype html>
<html lang="es">

<head>
  <meta charset="utf-8">
  <title>IronSyndicate</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <!-- Panel Principal Estilo GTA SA Stats Menu -->
  <section id="panel" class="panel">
    <div class="panel-header panel-header--linea">
      <!-- La misma clase que arman los cuatro menus de proximidad: el titulo se
           ve igual en los cinco paneles porque no hay dos recetas. El id queda
           como ancla para titleEl (app.js). -->
      <h1 id="title" class="panel__title">Inventario</h1>
      <!-- CJ al borde derecho de la MISMA linea, como el auto en el maletero: el
           encabezado dice de que menu es y de quien es. Ver
           .panel-header--linea. -->
      <p class="panel__subtitle">CJ</p>
    </div>

    <!-- Filtros de categoría del inventario. Antes eran pestañas de tres
         paneles (Inventario / Propiedades / Vehículos); ahora son botones que
         filtran el mismo listado. El nombre de la categoría lo sigue diciendo
         la banda de grupo de la tabla, así que el botón no lo repite: lleva
         alt y title para el lector de pantalla y el hover.

         TRES botones, y tres entradas en FILTROS (app.js). No son cinco: los de
         "Armas" y "Cargadores" se fueron con el sistema de armas, que dejó el
         catálogo sin filas de tipo weapon ni magazine. Se borraron del DOM
         porque un filtro que nunca muestra nada es peor que no tenerlo —el
         jugador aprieta "Armas" y no tiene forma de saber si es un dato o un
         botón muerto—, y porque el handler cae en FILTROS[0] cuando no
         encuentra la clave: un botón sobrante no dice "no hay", dice "Todos"
         mintiendo que filtró.

         "otros" no es una categoría del mod: es todo lo que no sea un material.
         Sale vacío mientras no haya otro tipo, pero es el que va a recibir al
         próximo item que se agregue sin tocar esta lista.

         Si se agrega un filtro, va en los dos lados: el botón acá y su
         entrada en FILTROS. -->
    <div id="tabs" role="tablist" aria-label="Filtros de categoría">
      <button class="btn btn--tab active" data-filter="all" role="tab" aria-selected="true" title="Mostrar todos los items">
        <img class="btn--tab-icon" src="assets/iconos/categorias/todos.png" alt="Todos">
      </button>
      <button class="btn btn--tab" data-filter="material" role="tab" aria-selected="false" title="Filtrar solo materiales">
        <img class="btn--tab-icon" src="assets/iconos/categorias/materiales.png" alt="Materiales">
      </button>
      <button class="btn btn--tab" data-filter="otros" role="tab" aria-selected="false" title="Filtrar otras categorías">
        <img class="btn--tab-icon" src="assets/iconos/categorias/otros.png" alt="Otros">
      </button>
    </div>

    <!-- Filas Interactivas -->
    <div id="rows" role="listbox" aria-label="Navegación IronSyndicate"></div>

<!-- Pie: peso a la izquierda, contrato de teclado a la derecha.

         Las dos keycaps son el contrato COMPLETO y no un parrafo: el inventario
         tiene las mismas tres teclas de abrir que los menus de esfera, asi que el
         jugador no tiene que aprender nada nuevo cuando cambia de panel. La
         diferencia es que la I tambien entra y sale, y por eso el texto de la
         primera keycap lo dice.

         La linea va en los CINCO menus y es la misma (app.js, HINT_TECLAS): antes
         el baul anunciaba un "3: cerrar maletero" que no hace nada con el menu
         abierto, y ningun otro panel mostraba ayuda. Un contrato que cambia segun
         el panel no es un contrato. -->
    <div id="foot">
      <div id="weight" aria-live="polite">Peso: 0kg/12kg</div>

      <div id="keyhints" class="keyhints" aria-label="Guía de teclas">
        <button class="keyhint" data-action="aceptar" type="button"
          title="INTRO — apretar: acepta la opción enfocada">
          <span class="keyhint__cap" aria-hidden="true">INTRO</span>
          <span class="keyhint__act">Aceptar</span>
        </button>
        <button class="keyhint" data-action="cerrar" type="button"
          title="F — apretar una vez: cierra el menú. I también entra y sale.">
          <span class="keyhint__cap" aria-hidden="true">F</span>
          <span class="keyhint__act">Cerrar</span>
        </button>
      </div>
    </div>
    </div>

  </section>

  <!-- Menú contextual de la fila. Va en body y no adentro de #panel a propósito:
       sale pegado al cursor en coordenadas de pantalla, así que tiene que poder
       salirse del box; y #rows es el contenedor de scroll, un menú dentro se
       movería con la lista. El contenido lo arma app.js desde ACCIONES. -->
  <div id="ctxmenu" class="ctxmenu" role="menu" hidden></div>

  <script src="app.js"></script>
</body>

</html>
