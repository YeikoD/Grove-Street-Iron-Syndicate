<!doctype html>
<html lang="es">

<head>
  <meta charset="utf-8">
  <title>IronSyndicate CEF UI</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <section class="panel">
    <header class="titlebar">
      <span class="dot"></span>
      <span class="title">IRON SYNDICATE // CEF CONTROL // By Yeiko</span>
      <span class="status" id="fps">ONLINE</span>
    </header>

    <div class="content">
      <div class="topgrid">
        <div class="card">
          <h2>Dynamic Signal</h2>
          <div class="label">Hora CEF</div>
          <div class="value glow" id="clock">--:--:--</div>
          <div class="label">Progress bar</div>
          <div class="bar">
            <div class="fill" id="fill"></div>
          </div>
          <div class="label">Slider control</div>
          <input id="slider" type="range" min="0" max="100" value="42">
        </div>

        <div class="card">
          <h2>Actions</h2>
          <div class="button" id="button">PULSAR / TEST</div>
          <p class="small" id="actionText">OnPaint → texture → GTA framebuffer</p>
        </div>
      </div>

      <div class="pipeline">
        <div class="chip"><b>CEF</b><span>Chromium OSR</span></div>
        <div class="chip"><b>ONPAINT</b><span>Buffer BGRA</span></div>
        <div class="chip"><b>D3D9</b><span>Texture GTA</span></div>
        <div class="chip"><b>BRIDGE</b><span>Ready / JS</span></div>
      </div>
    </div>
  </section>

  <script src="app.js"></script>
</body>

</html>
